note: >-
  Veeva does not publish its first-party client libraries to Maven Central, npm, or PyPI.
  Java artifacts are served from Veeva's own Maven repository at repo.veevavault.com (which
  answers an HTML application shell for /maven-metadata.xml paths, so no registry metadata
  endpoint is queryable), and the Vault Web SDK is distributed as a version-pinned tarball
  on a public S3 bucket. Versions below were read from the provider's own pinned URLs,
  pom.xml, and GitHub release tags rather than from a package registry.
