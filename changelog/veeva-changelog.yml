    breaking:
      - id: OOU0000000QX028
        title: Global API Header Changes
        limited_release: 26r1.2
        detail: >-
          Numeric-only HTTP status line (HTTP/1.1 200, not 200 OK); Expires header removed in
          favour of Cache-Control no-store/no-cache; Vary sent lowercase for HTTP/2 and HTTP/3.
          Integrations that string-match "OK" or rely on the 1970 epoch Expires break.
      - id: OOU0000000RP011
        title: SDK HttpService no longer supports TLS v1 and v1.1
        limited_release: 26r1.3
      - id: OOU0000000R5008
        title: ExecuteAs support for DocumentAction
        limited_release: 26r1.2
        detail: DocumentActionContext.getDocumentVersions() now defaults to the Java SDK Service Account instead of the Request Owner — a permissions shift.
    additions:
      - id: OOU0000000K6006
        title: NotificationService SDK enhancements
        detail: New NotificationQueue* interfaces; NotificationMessage, NotificationTemplate and NotificationParameters are announced for deprecation.
      - id: MCP_Announcement
        title: Vault Developer Docs MCP becomes Vault Docs MCP
        detail: >-
          As of 2026-06-08 the server added Platform Vault Help documentation alongside the API
          reference, SDK javadocs, VAPIL javadocs and Developer Portal content.
      - id: Vault_Docs_MCP_26R2_Updates
        title: Vault Documentation MCP updates — consolidated search tool
      - title: Query Profiler
        detail: Headline developer feature of 26R2 per the release index.
