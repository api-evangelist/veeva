description: 'Veeva Systems is the leading cloud software provider for the global life sciences industry,
  serving pharmaceutical, biotechnology, medical device and CRO customers across commercial, clinical,
  quality, regulatory, medical and safety operations. Its Vault platform is a single content-and-data
  cloud whose REST API covers documents, binders, configurable Vault objects, workflows, users, groups,
  SCIM provisioning, sandbox management and the Direct Data API for high-speed bulk export, all queryable
  with VQL and extensible through the Vault Java SDK, Custom Pages and Spark Messaging. Veeva also ships
  two first-party MCP servers: a public Vault Documentation MCP and a tenant-scoped Vault MCP Server that
  exposes Vault AI agent actions as MCP tools.'
