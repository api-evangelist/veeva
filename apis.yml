    type: SDKs
  - url: https://mvnrepository.com/artifact/com.veeva/vault-api-library
    type: SDKs
    title: Maven Central
  description: >-
    The Veeva Vault Java SDK (VAPIL) is an open-source Java-based REST API client for the Vault REST API.
    Provides type-safe access to all Vault API operations including document management, object CRUD,
    workflow execution, and administrative functions.
