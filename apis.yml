- aid: veeva:vault-mcp
  name: Veeva Vault MCP
  description: Veeva ships two first-party Model Context Protocol servers. The Vault Documentation MCP
    at https://docs.veevavault.dev/mcp is public and anonymous, exposing one search_documentation tool
    over the Vault Developer Portal, API reference, Vault Java SDK and VAPIL javadocs, and Vault Help.
    The Vault MCP Server at https://{host}/api/ai/mcp is tenant-scoped, requires a Bearer Vault API access
    token and the Vault AI entitlement, and exposes each Vault AI agent action the authenticated user
    may execute as an MCP tool.
  humanURL: https://general.veevavault.dev/mcp
  baseURL: https://docs.veevavault.dev/mcp
