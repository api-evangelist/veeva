  - type: has_one
    target: Lifecycle
    via: lifecycle__v
  - type: has_many
    target: Workflow
    via: document_id
  - type: belongs_to
    target: Binder
    via: binder section membership
- name: DocumentType
  description: Type / subtype / classification hierarchy that determines a document's field set.
  relationships:
  - type: has_many
    target: Document
    via: type__v
- name: Binder
  description: A structured collection of documents organised into sections; used for submissions and dossiers.
  relationships:
  - type: has_many
    target: BinderSection
    via: binder_id
  - type: has_many
    target: Document
    via: binder section membership
- name: VaultObject
  description: A configurable business object record (study, product, site, country, and customer-defined objects).
  source_schema: openapi/veeva-objects-api-openapi.yml#/components/schemas/ObjectRecordResponse
  operations:
  - listObjectRecords
  - createObjectRecord
  - getObjectRecord
  - updateObjectRecord
  - deleteObjectRecord
  relationships:
  - type: has_one
    target: ObjectType
    via: object_type__v
  - type: has_many
    target: ObjectRecordAttachment
    via: record_id
  - type: has_many
    target: VaultObject
    via: parent/child reference fields
  - type: has_many
    target: Workflow
    via: record_id
- name: User
  description: A Vault user, with permissions, application licence usage, and up to 25 API access tokens.
  source_schema: openapi/veeva-users-api-openapi.yml#/components/schemas/UserListResponse
  operations:
  - listUsers
  relationships:
  - type: has_many
