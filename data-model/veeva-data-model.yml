  relationships:
  - type: has_many
    target: WorkflowTask
    via: workflow_id
  - type: belongs_to
    target: Document
    via: document_id
  - type: belongs_to
    target: VaultObject
    via: record_id
- name: WorkflowTask
  description: A single assignable task within a workflow.
  relationships:
  - type: belongs_to
    target: Workflow
    via: workflow_id
  - type: belongs_to
    target: User
    via: assignee
- name: Picklist
  description: A configurable value list referenced by document and object fields.
- name: Queue
  description: Spark Messaging inbound/outbound message queue used for asynchronous integration.
  relationships:
  - type: has_many
    target: SparkMessage
    via: queue_name
  cross_reference: asyncapi/veeva-spark-messaging-webhooks.yml
