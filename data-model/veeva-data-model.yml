generated: '2026-08-15'
method: derived
source: openapi/*.yml + https://general.veevavault.dev/vault-api/api-reference/26.2/ + https://general.veevavault.dev/vql/
note: 'Derived from the operations and schemas captured in openapi/ and cross-checked against the published Vault
  API reference and VQL query targets. Vault''s data model is CONFIGURABLE: object names, fields, and relationships
  vary per Vault and per application family, so the entities below are the platform-level shapes every Vault has,
  not a fixed schema. Anything tenant-specific is discoverable at runtime through the Retrieve Object Metadata and
  Retrieve Document Fields endpoints, not published as a static model.'
configurable: true
runtime_discovery:
- endpoint: Retrieve Object Metadata
  path: /api/{version}/metadata/vobjects/{object_name}
- endpoint: Retrieve Object Field Metadata
  path: /api/{version}/metadata/vobjects/{object_name}/fields/{field_name}
- endpoint: Retrieve Document Fields
  path: /api/{version}/metadata/objects/documents/properties
- endpoint: Retrieve All Component Metadata (MDL)
  path: /api/{version}/metadata/components
id_conventions:
- pattern: '{id}'
  applies_to: object records and documents
  detail: Numeric or alphanumeric Vault ID.
- pattern: '{id}_{major}_{minor}'
  applies_to: document versions
  detail: e.g. 1001_1_3. Supplying just the id resolves to the latest version.
- suffix: __v
  meaning: Veeva-standard component or field.
- suffix: __sys
  meaning: Veeva system component or field.
- suffix: __c
  meaning: Customer-configured component or field.
entities:
- name: Vault
  description: A single tenant instance, addressed by its DNS. Sessions, tokens, and IDs are all scoped to one Vault.
  fields:
  - id
  - name
  - url
  relationships:
  - type: has_many
    target: Document
    via: vault_id
  - type: has_many
    target: VaultObject
    via: vault_id
  - type: has_many
    target: User
    via: vault_id
- name: Document
  description: A controlled document with lifecycle state, versions, renditions, annotations, attachments, and relationships.
  source_schema: openapi/veeva-documents-api-openapi.yml#/components/schemas/DocumentResponse
  operations:
  - listDocuments
  - createDocument
  - getDocument
  - updateDocument
  - deleteDocument
  - downloadDocumentFile
  - performDocumentAction
  relationships:
  - type: has_many
    target: DocumentVersion
